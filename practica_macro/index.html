<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Práctica EPD · Macroeconomía UPO</title>
  <meta name="description" content="Ejercicios ilimitados de Macroeconomía (UPO) con datos nuevos en cada intento, solución paso a paso y gráficos.">
  <meta name="theme-color" content="#0b1c36">
  <link rel="icon" href="../assets/isotipo_mh.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="barra">
    <div class="barra-in">
      <button class="btn-atras" id="btnAtras" type="button" aria-label="Volver" hidden>←</button>
      <a class="marca" href="#/" aria-label="Inicio de la práctica">
        <span class="marca-ico" aria-hidden="true">M</span>
        <span class="marca-txt"><b>Práctica EPD</b><small>Macroeconomía · UPO</small></span>
      </a>
      <label class="interruptor" title="Muestra pistas y la solución de cada apartado">
        <input type="checkbox" id="ayudas" checked>
        <span class="int-pista" aria-hidden="true"></span>
        <span class="int-txt">Ayudas</span>
      </label>
    </div>
  </header>

  <main id="app" class="contenedor" tabindex="-1">
    <noscript><p class="aviso">Esta práctica necesita JavaScript.</p></noscript>
  </main>

  <footer class="pie">
    <p>Macroeconomía · Doble Grado DER + FICO · Universidad Pablo de Olavide · Curso 2026-27</p>
    <p>Cada ejercicio tiene un código: si algo no te cuadra, compártelo con el profesor.</p>
  </footer>

  <script src="core.js"></script>
  <script src="epd1.js"></script>
  <script src="epd2.js"></script>
  <script src="epd3.js"></script>
  <script src="examen.js"></script>
  <script src="app.js"></script>
</body>
</html>
