<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140" fill="none">
  <defs>
    <linearGradient id="mhGradPrimaryLock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C271E"/>
      <stop offset="100%" stop-color="#A33327"/>
    </linearGradient>
    <linearGradient id="mhGradSecondaryLock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D47B5A"/>
      <stop offset="100%" stop-color="#E29272"/>
    </linearGradient>
    <filter id="shadowMhLock" x="-10%" y="-10%" width="130%" height="130%">
